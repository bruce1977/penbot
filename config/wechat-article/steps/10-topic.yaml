# 选题阶段：选题 → 判断类型 → 收集素材（auto 入口选题在前，定类在后；手动入口直接定类）
#
# key = step_name。模型调用统一写法（标准见根目录 AGENTS.md）：
#   models: { <调用名>: { id: <models.yaml 模型 id>, prompt / schema, options: { 调用级覆盖 } } }
# options 未配置的参数吃 models.yaml 端点默认；提示词和数据结构只引用 id：
# config/prompts/、config/schemas/。单调用节点可以把 prompt/schema 写在节点级。

steps:
  select_topic:
    label: 选题
    description: 双窗口筛选候选（文件日期 + 采集日期），生成词频热度表，一次模型调用提炼 3 个候选主题；手动入口可跳过。
    stage: topic
    modes: [auto, run]
    handler: builtin:select_topic
    models:
      # 写作模型生成候选主题（llm 模板 options：retry_limit / timeout / temperature / max_tokens）。
      # retry_limit = 结构化输出调用的总尝试上限（含首轮，1 = 不修复重试）。
      select:
        id: llm.local
        prompt: topic.select_topic
        schema: topic.select_topic
        options:
          retry_limit: 2
          # timeout = 本调用总限时（ms），覆盖 models.yaml profile 的 timeout_ms。
          timeout: 900000
      # 判断模型从候选主题中择一（systemone 模板 options：deep / escalate_below / min_confidence）。
      # 判定文案（state / instructions / criteria）在 prompts/topic.yaml 的 select_best。
      best:
        id: systemone.classifier
        prompt: topic.select_best
        options:
          # 一次判断置信度低于 escalate_below 时，用 deep 指向的重模型再判一次。
          deep: systemone.classifier-deep
          escalate_below: 0.65
    # 01-result.json 本体的校验契约：落盘前用紧凑 DSL 校验脚本自己的产物
    # （信封 + 选题字段 + 素材链接），不合格只警告，结果记 01-result.json#validation。
    # 与 models.*.schema（校验模型输出）是两件事，所以另用一个键。
    result_schema: topic.result
    artifacts:
      # 候选文章直接来自知识库目录，不经过文章产物。
      reads: []
      writes: ["01-result.json", "01-step/topic.md", "01-step/proposal.json"]
    depends_on: []

  classify_type:
    label: 判断文章类型
    description: 根据标题 + 提纲，用 System One 决策模型选择最合适的文章类型。
    stage: topic
    modes: [auto, manual, run]
    handler: builtin:classify_type
    models:
      # 判断模型调用（System One）：端点/密钥默认在 models.yaml systemone.classifier，
      # 这里只放该调用的行为参数。
      classify:
        id: systemone.classifier
        options:
          deep: systemone.classifier-deep
          escalate_below: 0.65
          # 最终置信度低于该值时按 defaults.yaml classifier.default_type 兜底。
          min_confidence: 0.5
    # 判断模型的回答由 classify.mjs 自己解析（答案必须是候选类型 id、置信度是数字），
    # 没有可执行的输出契约可挂，因此不写 schema；下面的格式是形状备注（人读 + steps 打印）。
    prompt: topic.classify_type
    input_format:
      title: "string（选题标题，或 --topic 给的自定义主题）"
      outline: "string?（auto 入口传选题的 thesis 当提纲）"
      types: "Array<{id, description}>（config/types 里启用的类型）"
    output_format:
      id: "string（类型 id，落在候选类型里）"
      name: "string"
      source: "classifier|deferred|default|cli|env|input|article（TYPE_SOURCE_LABEL）"
      confidence: "number(0..1)?（非判断模型定类时没有）"
      reason: "string?"
    artifacts:
      # 标题和提纲由命令行传入；定类结果并入 01-result.json 的 type 字段。
      reads: []
      writes: ["01-result.json#type"]
    depends_on: []

  gather_materials:
    label: 收集素材
    description: 按主题关键词扫描本地知识库，截取相关段落并排序；不足时用 opencode websearch 补充外部检索。
    stage: topic
    modes: [auto, manual, run]
    handler: builtin:gather_materials
    # 无模型调用（websearch 是 opencode 工具节点，检索模型在 defaults.yaml
    # knowledge.web-search.model；闸门与超时同段），也没有可校验的模型输出，
    # 因此不挂 schema；下面的格式是形状备注（人读 + steps 打印）。
    input_format:
      topic: "Topic（选题结果：title / keywords / source_hints 决定检索词）"
      knowledge: "type.knowledge（max_sources、excerpt_chars、web-search.*）"
      notes: "Array<Note>（本地知识库扫出的候选段落）"
    output_format:
      sources: "Array<{index: number, title: string, link: string}>（link 相对文章目录，正文在 01-step/sources/*.md）"
    artifacts:
      # 素材收集属于选题步：数组并入 01-result.json 的 sources 字段，不另开产物编号。
      reads: ["01-result.json"]
      writes: ["01-result.json#sources"]
    depends_on: [select_topic]
