# 发布阶段：发布 → 归档
#
# key = step_name。这两个节点不调用模型（无 models 段），也不需要提示词，只引用数据结构 id。
# 发布渠道开关单源在 defaults.yaml defaults.publish.*（email/wechat.enabled、auto_publish），
# 命令行 --email / --wechat / --auto-publish 可临时触发。

steps:
  publish:
    label: 发布
    description: 生成终稿，按渠道开关投递邮件和公众号草稿；未真实成功则留在 draft/。
    stage: publish
    enabled: true
    modes: [auto, manual, run, publish]
    handler: builtin:publish_article
    schema: publish.publish
    artifacts:
      reads: ["05-step/illustrated.md"]
      writes: ["06-step/final.md", "06-step/final.html?", "06-result.json"]
    depends_on: [image_generation]

  archive:
    label: 归档
    description: 发布成功后复制终稿到知识库 pipeline，打包到 published/，再删除 draft/<slug>/。
    stage: archive
    enabled: true
    modes: [auto, manual, run, publish]
    handler: builtin:archive_article
    schema: publish.archive
    artifacts:
      reads: ["06-result.json"]
      writes: ["../../published/<date>-<slug>.zip"]
    depends_on: [publish]
