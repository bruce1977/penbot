# 去 AI 化阶段（04）：配置就绪，运行时暂未接线
#
# 接线后：读 03-step/reviewed.md，写 04-step/polished.md + 04-result.json，
# 并把 50-illustrate.yaml 的 reads 从 reviewed.md 切到 polished.md。
# key = step_name。模型调用统一写 models: { <调用名>: { id, options } }。

steps:
  de_ai:
    label: 去 AI 化
    description: 把 AI 味重的表达改成自然、具体、有人味的中文；不改事实、结构、配图标记。
    stage: polish
    enabled: true
    modes: [auto, manual, run, review]
    handler: builtin:de_ai
    models:
      de_ai:
        id: llm.local
        options:
          retry_limit: 1
          timeout: 900000
    prompt: revision.de_ai
    schema: revision.de_ai
    artifacts:
      reads: ["03-step/reviewed.md"]
      writes: ["04-step/polished.md"]
    depends_on: [scoring]
