# 全局默认配置
#
# 这里放与“具体类型”和“具体步骤”都无关的运行时默认值：
#   - project：文章根目录
#   - classifier：判断模型的行为参数（开关/问题名/兜底类型；调用配置在 steps 节点）
#   - defaults：所有文章类型共享的默认值（review / knowledge / illustrations / publish）
#
# 模型定义在 config/models.yaml；类型清单在 config/article-types.yaml；
# 流程节点在 config/steps.yaml。
# 加载顺序：defaults.yaml → models.yaml → article-types.yaml（可覆盖）→ config/types/*.yaml。

project:
  # 文章根目录：只认环境变量/配置，命令行不能覆盖
  base_output_folder: "${BASE_OUTPUT_FOLDER:-output/wechat-article}"

# ---------------------------------------------------------------------------
# 判断模型（System One 决策模型）：根据「标题 + 提纲」自动选择文章类型
#
# 这里只留行为参数（开关 / 问题名 / 兜底类型）。
# 模型本身与各调用的升级/置信度参数在 steps 节点（10-topic.yaml）：
#   classify_type.models.classify（定类）、select_topic.models.best（择题），
# options 未配置的参数吃 models.yaml systemone.* 端点默认。
#
# 走 System One 协议：POST {base_url}/v1/systemone
#   body:     { model, state, questions: { article_type: { type: choice, ... } } }
#   response: { answers: { article_type: { choice, probabilities, confidence } } }
# 兼容 TypeSafe Jev、基石智算 Laya、vLLM /v1/systemone。
# 判断模型不可用时自动回退 default_type。
# ---------------------------------------------------------------------------
classifier:
  enabled: true
  # questions 里的问题名，答案会从 answers.<question> 读取
  question: article_type
  # 选题判定（select_topic.models.best）的问题名
  topic_question: topic_pick
  # 审稿循环去留判定（scoring.models.check）的问题名
  check_question: review_check
  # 判断失败/置信度不足时用哪个类型
  default_type: ai-news

# ---------------------------------------------------------------------------
# 编排器（scripts/wechat-article-pipeline.mjs）：inbox 监听 + draft 巡检的无人值守推进
#
# 运行时能翻转的开关/阈值一律写成 ${PB_*:-默认}：无人值守跑时只改 .env，这个文件不动。
# inbox 根目录不在这里配——只认环境变量 BASE_INBOX_FOLDER（留空 = 关闭 inbox 监听，
# watcher 仅做 draft 巡检），实际目录 = BASE_INBOX_FOLDER/wechat-article。
#
# 推进模型：单并发。inbox 素材先经判断模型分成「标题素材 / 草稿素材」，分别走 manual / post
# 入口建目录（进入流转即删 inbox 原稿），随后每阶段用 `auto --article <slug> --stage <阶段>`
# 接力推进；每个阶段子进程带自己的超时，超时 kill 后下一轮按上一步产物续跑。
# ---------------------------------------------------------------------------
pipeline:
  # inbox 扫描间隔（ms）：新素材多久被发现一次
  poll_ms: "${PB_PIPELINE_POLL_MS:-15000}"
  # draft 巡检间隔（ms）：续跑巡检多久跑一轮（本地模型慢，整篇 30 分钟目标 → 每小时巡检一次）
  inspect_ms: "${PB_PIPELINE_INSPECT_MS:-3600000}"
  # 同一篇文章连续失败 / 无进展达几次就标记跳过（不再自动重试），记日志等人处理
  max_fails: "${PB_PIPELINE_MAX_FAILS:-3}"
  # 每阶段子进程超时（ms）：超时即 kill，下一轮按产物从该阶段续跑
  stage_timeouts:
    topic: "${PB_TIMEOUT_TOPIC_MS:-900000}"      # 15 分钟：选题 + 素材收集
    draft: "${PB_TIMEOUT_DRAFT_MS:-1800000}"     # 30 分钟：纲要 + 初稿（本地写作模型慢）
    review: "${PB_TIMEOUT_REVIEW_MS:-2700000}"   # 45 分钟：核稿 + 修正 + 评稿多轮循环
    compose: "${PB_TIMEOUT_COMPOSE_MS:-1800000}" # 30 分钟：去 AI 化 + 配图（并发）
    publish: "${PB_TIMEOUT_PUBLISH_MS:-600000}"  # 10 分钟：终稿 + 投递 + 归档
  # inbox 素材分类（标题素材 → manual --topic，草稿素材 → post --file）。
  # 判断请求文案（state / instructions / criteria）单源在这里：watcher 不是流程节点，
  # 不能把提示词挂到 prompts/（那里有「必须被节点引用」的孤儿检查），故与 classifier
  # 的行为参数一样落在 defaults.yaml，代码里不留副本。
  classify:
    enabled: "${PB_PIPELINE_CLASSIFY:-true}"
    # 判断用的 systemone 模型 id（models.yaml systemone.* 里的一个）
    model_id: systemone.classifier
    # questions 里的问题名，答案从 answers.<question> 读取
    question: material_kind
    # {{text}} = 素材正文（截断），{{title}} = 首个标题/文件名
    state: |
      判断下面这份 inbox 素材属于哪一类，只看它是否已有成篇正文。
      标题：{{title}}
      素材：
      {{text}}
    instructions: |
      根据素材内容判断它是「标题素材」还是「草稿素材」：标题素材从选题开始写，
      草稿素材已有成篇正文、直接进入审稿。
    criteria:
      topic: 只有标题、简短提纲或零散想法，没有成篇正文，需要从选题/初稿开始。
      draft: 已有成篇正文（完整段落的 Markdown 稿件），可直接进入审稿。

# ---------------------------------------------------------------------------
# 文章类型默认值：所有类型先吃这里，再被 config/types/<id>.yaml 覆盖
#
# 运行时可翻转的开关/阈值一律写成 ${PB_*:-默认值}：无人值守跑管线时只改 .env，
# 这个文件保持不动（例外：投递开关是 steps 节点的 handler_options，见 steps/50-publish.yaml）。
# expandEnv 替换出来的是字符串，加载期 scripts/lib/config.mjs 统一归一：
# 布尔走 toBool，数字走 Number + 有限性检查，代码里不再留同值兜底。
# ---------------------------------------------------------------------------
defaults:
  # 模型末位回退（--model > 节点 models.<调用名>.id > type.model）。
  # 正常情况下各步骤模型都配在 steps 节点，这里只在节点没配时兜底。
  model: llm.large

  review:
    # 评稿模型在 steps/30-review.yaml scoring.models.score；这里只留审稿循环参数。
    # 轮次上限 1-5（加载期 clamp）；单篇想临时改再用 --rounds。
    max_rounds: "${PB_REVIEW_ROUNDS:-3}"
    # 通过线只是**没有类型覆盖时**的默认值：types/<id>.yaml 的顶层 pass_score 优先。
    pass_score: "${PB_PASS_SCORE:-80}"
    correct_cn:
      enabled: true
      base_url: "${PB_PYCORRECTOR_API_URL:-https://correct-api.myehome.top}"
      # 两个规则端点并行调用，只采集候选：错别字候选交给修正模型核实，敏感词只留痕。
      correct_endpoint: "/api/correct"
      sensitive_endpoint: "/api/sensitive/check"
      api_key: "${PB_PYCORRECTOR_API_KEY}"
      auth_header: Authorization
      timeout_ms: 30000
      # 单次调用内的 HTTP 重试次数（(尝试) 标注，不推轮次）。
      retries: 1

  knowledge:
    source: local
    use_weknora: "${PB_USE_WEKNORA:-false}"
    # 本地素材最多取几条（类型文件可覆盖；闸门判「够不够」也以此为分母）。
    max_sources: "${PB_KNOWLEDGE_MAX_SOURCES:-8}"
    excerpt_chars: 1800
    max_file_bytes: 400000
    weknora:
      base_url: "${WEKNORA_BASE_URL}"
      api_key: "${WEKNORA_API_KEY}"
      auth_header: X-API-Key
      # match_count 不在这写死：加载期由上面的 knowledge.max_sources 推导
      # （同一个条数上限，PB_KNOWLEDGE_MAX_SOURCES 一改两边都变），类型文件要单独调再写。
      timeout_ms: 30000
    # 通道 2：充分性闸门判定本地不足时，用 opencode websearch 补外部素材。
    # websearch 不是模型调用：model 是 opencode 侧配置的 provider/model（与
    # config/models.yaml 无关），默认跟随环境变量 OPENCODE_DEFAULT_MODEL。
    # 类型文件可覆盖（如随笔类设 enabled: false 关掉出门检索）。
    web-search:
      # 出门检索总开关（.env PB_WEB_SEARCH_ENABLED=false 即只用本地素材）。
      enabled: "${PB_WEB_SEARCH_ENABLED:-true}"
      model: "${OPENCODE_DEFAULT_MODEL:-ollama-local/qwen3.5:9b}"
      max_queries: 2      # 最多几组关键字（标题一组 + 关键词一组）
      max_per_query: 3    # 每组结果解析取几条
      max_sources: 6      # 最多并入几条外部素材
      excerpt_chars: 800  # 外部结果摘录截断
      timeout_ms: 180000  # 单组检索超时（实测单组 40–170s）；各组并行，所以这也是外部检索的总时长上限
      gate:
        min_hits_ratio: 0.5     # 命中数 < max_sources × 该比例 → 不足
        min_excerpt_chars: 3000 # 本地摘录总字数下限
        min_hint_coverage: 0.5  # source_hints 覆盖率下限
        fresh_days: 90          # 无任何命中在此窗口内 → 不足

  illustrations:
    min: 1
    max: 5
    cover: true
    # 同时在飞的配图请求数；跑满限速或想降载时改 .env 的 PB_IMAGE_CONCURRENCY。
    # 张数不吃 .env：由纲要的 image_plan 小节规划决定，单次想指定用 --images
    # （类型里的 image_count 区间是类型身份，不是运行时旋钮）。
    concurrency: "${PB_IMAGE_CONCURRENCY:-2}"
    on_failure: comment
    # 配图标记模板：{index} 会被替换成 1..N
    position_format: "[[img:{index}]]"
    style: "扁平化科技插画，干净留白，克制的蓝紫与暖橙配色，适合微信公众号阅读，不要出现文字"
    negative_prompt: "photorealistic, 3d render, oil painting, western fantasy, anime style, manga, chibi, too many details, cluttered composition, bright neon colors, over-saturated, soft focus, blurry, deformed hands, extra limbs, signature, watermark, text, words, logo"
    # 两种尺寸：文章封面 + 正文插图（第 1 张固定封面，其余正文）。
    # width/height 进图片模型的请求参数；composition 进配图提示词的 {{composition}}
    # （模板见 prompts/revision.yaml → image_generation）。
    scenes:
      wechat-cover: { width: 900, height: 383, composition: "wide banner composition, subject placed off-center, clear empty area for a headline overlay" }
      article-inline: { width: 1080, height: 810, composition: "4:3 framing, one clear focal subject with supporting details" }
    # 通道顺序：主通道先出图，只有它失败才降级到备用通道（不是并发抢跑）。
    # ModelScope 质量明显更好（实测扁平插画无文字残留），设为唯一主选。
    primary: modelscope
    fallback: [pollinations]
    modelscope:
      enabled: true
      base_url: https://api-inference.modelscope.cn
      api_key: "${PB_MODEL_IMAGE_API_KEY}"
      model: Tongyi-MAI/Z-Image-Turbo
      # 单次 HTTP 请求（提交/轮询/下载）限时 2 分钟
      timeout_ms: 120000
      poll_interval_ms: 5000
      # 异步任务轮询上限：单张实测 10-45s，按 1-2 分钟预算给 24 次
      max_polls: 24
    pollinations:
      enabled: true
      base_url: https://image.pollinations.ai
      model: turbo
      timeout_ms: 90000
      # 免费档（无 key）实测：每 IP 45 秒 1 张，且同时只允许 1 张在飞；
      # ref/referrer/model 参数都不另开配额，所以只能进程内排队，不能靠它做并发。
      min_interval_ms: 45000
      max_retries: 2

  publish:
    # 投递开关（发不发、发哪个渠道）单源在 steps/50-publish.yaml 的 publish.handler_options；
    # 这里只放渠道参数。命令行 --email / --wechat / --auto-publish 可临时覆盖。
    archive:
      # 归档环节整体开关在 steps 节点 archive.enabled（关掉 = 不入库、不打包、不删 draft）。
      # 这里只管知识库入库：knowledge_dir 留空 = 跳过复制，仍照常打包与清理。
      # 终稿统一落到本地知识库的 pipeline 目录，由后续入库脚本扫描处理。
      knowledge_dir: "${KNOWLEDGE_PIPELINE_DIR:-D:/knowledge/pipeline}"
      filename: "{date}-{slug}.md"
    email:
      to: ["jiangyifeng@myehome.cn"]
      from: "${PB_RESEND_FROM:-penbot@myehome.cn}"
      api_key: "${PB_RESEND_API_KEY}"
      subject: "{title}"
      # 投递端点、单次请求限时与重试次数：sendEmail 只读这三项，代码里不留同值副本
      # （原来 base_url 硬在代码里、timeout_ms 硬写 30000、retries 兜 2，配置根本没有后两项）。
      base_url: https://api.resend.com
      timeout_ms: 30000
      # 单次投递的 HTTP 重试次数（留痕里是 (尝试) 标注，不推轮次）。
      retries: 2
    wechat:
      theme: default
      highlight: solarized-light
      env_file: .env
      # @wenyan-md/cli 已写进 package.json dependencies，npx 会优先用本地 node_modules/.bin/wenyan，
      # 版本被 lockfile 锁住、断网也能跑；改成别的命令串（如全局安装）时这里覆盖即可。
      command: npx --yes @wenyan-md/cli
      dry_run: false
      # 凭据：管线用 WECHAT_MP_APP_ID / WECHAT_MP_APP_SECRET，spawn 时自动映射成
      # wenyan CLI 实际读取的 WECHAT_APP_ID / WECHAT_APP_SECRET（CLI 的环境变量只认这两个名字）。
      # app_id: ""            # 可选：有值时额外用 --app-id 传给 CLI；publish 没有 --app-secret
      #                       # 参数，secret 只能走环境变量或 CLI 自己的 credential.json。
      # 公众号后台有 IP 白名单：本机 IP 不在名单时取 access_token 直接失败（errcode 40164）。
      # 绕过方式是走 CLI 的远程发布服务端，需要自建：
      #   server: https://api.yourdomain.com
      #   api_key: "${WENYAN_SERVER_KEY}"   # 密钥进命令行，日志与留痕一律打码
      # 代码已支持这两个键（--server/--api-key），留空即按本机直连微信 API。
