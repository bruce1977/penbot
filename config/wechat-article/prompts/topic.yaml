# 提示词：选题阶段
# key = 配置项名；完整 id = <文件名>.<key>，例如 topic.classify_type。

prompts:
  classify_type:
    instructions: |
      判断这篇公众号文章最适合归入哪个类型。只依据标题和提纲表达的内容与体裁，
      不要依据选项在列表中的顺序，也不要因为某个类型的描述更长而偏向它。
    state: |
      标题：{{title}}

      提纲：
      {{outline}}

  select_topic:
    # 下面这些整句文案按条件二选一，代码只负责挑 key（缺 key 抛错，不静默铺副本）：
    #   audience_line     —— 类型没定类（auto 占位类型没有 style）时整行省略
    #   mode_line_*       —— 手动指定主题 / 自动挑选
    #   dedupe_rule_*     —— 归档里已有文章 / 还没有历史文章
    #   length_range      —— 类型没写字数区间时整行留空
    audience_line: 目标读者：{{audience}}
    mode_line_auto: 请从下列近期知识库文章中自动挑选 {{count_label}}最值得写的主题。
    mode_line_manual: |
      用户已指定主题：{{user_topic}}
      补充要求：{{user_requirements}}
    dedupe_rule_with_history: 严禁与上方「已写过的文章」重复：事件、标题、核心判断任一撞车的候选会被程序直接作废，白白浪费名额；宁可退选热度较低的新方向。
    dedupe_rule_no_history: 与已有文章形成差异，不要重复同一事件的消息面。
    length_range: 目标篇幅 {{length.min}}-{{length.max}} 字。
    system: |
      你是「{{type_name}}」栏目的选题编辑。{{type_description}}
      {{audience_line}}
      你的任务是从近期知识库文章中提炼{{count_label}}值得写的主题，而不是简单复述某一篇。
      时效以每个条目、每个热词给定的「距今天数 / 新采集」为准，不要自行推断当前日期或文章新鲜度。
      只输出一个合法 JSON 对象，不要输出 Markdown 代码块、解释或前后缀。
      所有字符串使用中文，除专有名词外不要夹杂英文。
      不要编造候选列表和热度表中不存在的事件。
    user: |
      {{mode_line}}

      近期文章候选（仅标题，日期已换算为距今天数）：
      {{candidates}}

      词频热度表（跨文档统计，篇数越多越能支撑一个方向）：
      {{heatmap}}

      已写过的文章（来自发布归档，避免重复选题）：
      {{written}}

      选题要求：
      1. 主题要具体，能用一个明确判断或问题概括，不要写成「AI 行业观察」这类空泛题目。
      2. 优先选择热度表多篇支撑、且有「新采集」条目的方向。
      3. {{dedupe_rule}}
      4. 主题必须能由候选列表中的文章支撑：每个主题给出至少 2 个 source_hints，且必须是候选列表中出现过的原标题。
      5. {{length_range}}
      6. {{count}} 个主题之间必须明显不同：事件不同、判断不同、切入角度不同；尽量来自不同的候选文章。
      7. 按推荐优先级从高到低排列，并给出 0-100 的 score。

      输出 JSON 结构：
      {
        "topics": [
          {
            "topic": "一句话主题（不超过 64 字）",
            "title": "拟定文章标题（不超过 64 字）",
            "thesis": "核心判断，一句话，必须可证伪",
            "angle": "切入角度，说明与常见报道的差异",
            "rationale": "为什么现在写这个主题（80 字内，引用给定的天数/篇数）",
            "score": 0,
            "keywords": ["检索关键词"],
            "source_hints": ["候选列表中的原标题"],
            "title_candidates": ["备选标题"]
          }
        ]
      }

  select_best:
    instructions: |
      这些是同一批候选选题，请选出最值得现在写的一个，返回其编号。依据：素材是否新、
      核心判断是否有信息量、标题是否具体不空泛。写作模型评分只作参考；编号只是标签，
      不要偏向任何编号。
    state: |
      候选主题（公众号选题，一次模型调用产出，按评分从高到低）：

      {{blocks}}
