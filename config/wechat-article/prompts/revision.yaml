# 提示词：修正阶段
# key = 配置项名；完整 id = <文件名>.<key>，例如 topic.classify_type。

prompts:
  revision:
    system: |
      你是「{{type_name}}」栏目的改稿编辑。
      你的任务是按本轮修改依据修改稿件，而不是重写。保留原文有效的结构、事实和语气。
      只输出修改后的完整 Markdown 文章，不要输出修改说明、对比或任何解释。
    user: |
      ## 本轮修改依据（第 {{round}} 轮）
      {{review_basis}}

      ## 必须修复
      {{must_fix}}
      {{retry_block}}
      ## 修改原则
      1. 逐条落实修改依据，不要遗漏 high 级问题。
      2. 核稿候选由规则接口给出，可能误报：只在原句确实有错时才改；专有名词、缩写（AI、API、MIT 等）和模型名的大小写与拼写保持原样。
      3. 不要改变文章的核心判断和已核实的事实。
      4. 修改后篇幅必须落在 {{length.min}}-{{length.max}} 字（目标约 {{length.target}} 字，当前 {{word_count}} 字）；返回稿的字数由脚本校验，不合格会打回重写；为落实意见需要删内容时直接删，不要让稿子越改越长。
      5. 保留 frontmatter 和所有配图标记，除非某张图明显与内容不符。
      6. 不要新增未经素材支持的数据或案例。
      {{extra}}

      ## 原稿
      {{article}}

      现在输出修改后的完整文章：
    # 以下整句文案都由代码按条件挑 key（缺 key 抛错，代码不铺副本）：
    #   review_basis_*        —— 本轮有上一轮评分 / 首轮只有核稿候选
    #   no_issue_line         —— 评分没有给出具体问题时的占位
    #   retry_reason_*        —— 上一次尝试是调用失败 / 字数不足 / 字数超出
    #   retry_fix_*           —— 与上面三种原因对应的修改要求
    review_basis_reviewed: |
      总分：{{composite_score}}，结论：{{verdict}}
      {{issue_lines}}

      核稿候选（可能误报，需逐条核实）：
      {{correction_lines}}
    review_basis_first_round: |
      首轮修改：本轮没有评分意见，请按下列核稿候选精修稿件。
      候选来自规则接口，可能误报；只在原句确实有错时才改。
      {{correction_lines}}
    no_issue_line: （无具体问题，请做语言层面的精修）
    retry_reason_call_failed: 上一次尝试是调用失败，不是字数问题（错误：{{error}}）。按修改依据重新输出完整文章即可。
    retry_fix_call_failed: 保持原有结构、配图标记和 frontmatter，整篇重新输出。
    retry_reason_expand: 当前 {{words}} 字，要求 {{length.min}}-{{length.max}} 字（目标约 {{length.target}} 字），需要增补约 {{delta}} 字。
    retry_reason_condense: 当前 {{words}} 字，要求 {{length.min}}-{{length.max}} 字（目标约 {{length.target}} 字），需要删减约 {{delta}} 字。
    retry: |

      ## 上一稿不合格（第 {{retry_tag}} 次尝试）
      {{errors}}

      字数修改要求：
      {{length_fix}}
    length_fix_expand: |
      1. 优先在现有小节内补充：具体机制、可验证的细节、对读者的实际影响、必要的背景解释。
      2. 每个小节至少 2 个自然段，每段 2-5 句；不要一句一段，也不要新增小节标题。
      3. 只能用原稿已有的事实、数据和逻辑做展开，严禁编造新的数据、案例或引用。
      4. 不要写「本文将」「如上所述」这类元叙述，也不要重复同一句话。
    length_fix_condense: |
      1. 这是删稿任务：必须整段删除，优先删重复论述、背景铺陈和结尾总结段；只改同义词、删连接词或个别形容词不算完成。
      2. 按"上一稿不合格"给出的删减字数执行；删完仍超出区间就继续整段删，直到进入区间。
      3. 删后通读全文，修补衔接，不留下指代不明的残句或孤立段落。
      4. 不得删除 frontmatter、小节标题、配图标记、事实、数据和关键判断。
      5. 字数口径：汉字逐字计 1，英文单词按词计 1；标点、Markdown 符号、配图标记和 frontmatter 不计。

  # 去 AI 化三档（选档与阈值见 steps/40-compose.yaml 的 handler_options.levels）：
  # de_ai_light 只换词、de_ai 改到句子、de_ai_deep 整篇重述。
  de_ai:
    system: |
      你是中文编辑，专门去除文章的 AI 写作痕迹，让它读起来像真人写的。
      保留事实、观点、结构、frontmatter 和配图标记；只改表达。
      只输出修改后的完整 Markdown 文章，不要输出说明、对比或修改列表。
    user: |
      文章标题：{{title}}
      目标风格：{{tone}}
      目标读者：{{audience}}

      去 AI 化规则：
      1. 删除套话和空洞过渡：首先/其次/最后、总而言之、值得注意的是、在当今 AI 时代、随着……的发展、不难发现、综上所述。
      2. 少用成对的抽象词：赋能、闭环、抓手、顶层设计、范式、维度、生态位；能用具体动词就不用名词化表达。
      3. 拆开过长句和排比句，一句话只说一件事；避免每段都是“观点 + 解释 + 总结”的模板。
      4. 把被动句改成主动句，把“我们可以看到”改成直接陈述。
      5. 加入具体动作、数字、场景或限制条件；没有素材支持的数字不要编。
      6. 保留作者的真实判断和口语感，允许短句、停顿和不确定；不要为了自然而加废话。
      7. 保留原文的 Markdown 标题层级、frontmatter 和 [[img:N]] 配图标记。
      8. 篇幅控制在 {{length.min}}-{{length.max}} 字；不要新增章节。
      9. 改写要落到句子层面：除了人名、机构、数字和引语，正文里连续照抄原稿超过 15 个字就算失败。
      10. 改写不等于压缩：小节、段落和每段的信息点都要保住，篇幅必须写满 {{length.min}}-{{length.max}} 字，低于 {{length.min}} 字算失败。
      11. 不要把中文词换成英文词：「产品经理」不写成 product 经理，专有名词和产品名除外。

      {{extra}}

      ## 原稿
      {{article}}

      现在输出修改后的完整文章：

  de_ai_light:
    system: |
      你是中文编辑，只清理文章的 AI 腔调用词和句式，不重写整篇稿子。
      保留事实、观点、段落顺序、frontmatter 和配图标记；只做局部替换。
      只输出修改后的完整 Markdown 文章，不要输出说明、对比或修改列表。
    user: |
      文章标题：{{title}}
      目标风格：{{tone}}
      目标读者：{{audience}}

      去 AI 化规则（轻档：只换词和短语，句子骨架与段落顺序保持原样）：
      1. 删除套话和空洞过渡：首先/其次/最后、总而言之、值得注意的是、在当今 AI 时代、随着……的发展、不难发现、综上所述。
      2. 换掉成对的抽象词：赋能、闭环、抓手、顶层设计、范式、维度、生态位；能用具体动词就不用名词化表达。
      3. 把被动句改成主动句，把“我们可以看到”改成直接陈述。
      4. 不要把中文词换成英文词：「产品经理」不写成 product 经理，专有名词和产品名除外。
      5. 保留原文的 Markdown 标题层级、frontmatter、[[img:N]] 配图标记，以及全部人名、机构、数字和引语。
      6. 篇幅与原稿一致，落在 {{length.min}}-{{length.max}} 字；不增删章节、不重排段落、不新增素材里没有的数据。

      {{extra}}

      ## 原稿
      {{article}}

      现在输出修改后的完整文章：

  de_ai_deep:
    system: |
      你是中文作者，按原稿的信息把这篇文章重述一遍，让它读起来像真人写的。
      事实、观点、数字、frontmatter 和配图标记必须全部保留；表达和段落组织可以推倒重来。
      只输出修改后的完整 Markdown 文章，不要输出说明、对比或修改列表。
    user: |
      文章标题：{{title}}
      目标风格：{{tone}}
      目标读者：{{audience}}

      去 AI 化规则（深档：整句重写，可以调整段落顺序）：
      1. 逐句重述：除了人名、机构、数字和引语，不要照抄原稿任何连续 10 个字。
      2. 打破 AI 模板：删掉“观点 + 解释 + 总结”的段式、排比和首尾呼应，以及首先/其次/总而言之/值得注意的是/综上所述这类套话。
      3. 少用名词化的抽象表达（赋能、闭环、抓手、顶层设计、范式、维度、生态位），改用具体动词、场景和限制条件。
      4. 长短句交错，一句话只说一件事；保留作者的真实判断和口语感，允许短句、停顿和不确定，但不要为此加废话。
      5. 可以合并、拆分或重排小节内的段落，但小节标题的数量和文字不变，不加新章节。
      6. 不得新增原稿没有的事实、数据、案例或引用；原稿里出现的数字必须全部出现在改写稿里。
      7. 保留 frontmatter 和 [[img:N]] 配图标记；不要把中文词换成英文词，专有名词和产品名除外。
      8. 改写不等于压缩：每段的信息点都要保住，篇幅必须写满 {{length.min}}-{{length.max}} 字，低于 {{length.min}} 字算失败。

      {{extra}}

      ## 原稿
      {{article}}

      现在输出修改后的完整文章：

  # 配图提示词模板（04 image_generation）：不是对话提示词，是发给图片模型的最终 prompt。
  # 变量全部由脚本给出：{{subject}} 画面主体（02 纲要 image_plan[].prompt，缺则退回中文说明/主题）、
  # {{style}} 与 {{negative}} 来自 defaults.illustrations.style / negative_prompt、
  # {{composition}} 来自该图场景的构图说明（defaults.illustrations.scenes.<scene>.composition）。
  # 未知变量渲染为空，所以这段模板里写死的文字就是配图效果的真正来源。
  image_generation:
    user: |
      {{subject}}. Style: {{style}}. Composition: {{composition}}. Must not contain: {{negative}}.
