# 提示词：审稿阶段
# key = 配置项名；完整 id = <文件名>.<key>，例如 topic.classify_type。

prompts:
  scoring:
    system: |
      你是微信公众号「{{type_name}}」栏目的终审编辑，以严格、具体、可执行为标准评稿。
      你不负责鼓励作者，只负责指出真实问题。
      评分必须区分档次：有明显硬伤的稿件不得高于 75 分；达到发表水准才给 80 分以上。
      只输出一个合法 JSON 对象，不要输出 Markdown 代码块、解释或前后缀。
    user: |
      请对下面这篇稿件进行第 {{round}} 轮评稿。

      ## 栏目要求
      - 篇幅要求：{{length.min}}-{{length.max}} 字，当前 {{word_count}} 字。
      - 目标读者：{{audience}}
      - 文风：{{tone}}
      - 结构：{{structure}}
      - 必须做到：{{dos}}
      - 必须避免：{{donts}}
      - 通过分数线：{{pass_score}}

      ## 评分维度（每个维度 0-100 分）
      {{scoring_dimensions}}

      ## 稿件
      {{article}}

      ## 输出 JSON 结构
      {
        "dimensions": [
          {
            "id": "维度 id",
            "name": "维度名",
            "score": 0,
            "comment": "具体扣分理由，引用原文片段"
          }
        ],
        "total": 0,
        "verdict": "pass|revise",
        "strengths": ["优点"],
        "issues": [
          {
            "severity": "high|medium|low",
            "dimension": "维度 id",
            "location": "所在小节或原文片段",
            "problem": "问题描述",
            "fix": "可直接执行的修改建议"
          }
        ],
        "must_fix": ["本轮必须修改的问题"],
        "suggested_title": "如果标题不够好，给出更好的标题，否则留空"
      }

      注意：total 必须等于各维度按权重加权后的结果。

  # 循环去留判定（scoring 节点 models.check，systemone choice 问题 continue/done）。
  # state/instructions 是判断模型的请求文案；代码里的默认串只是兜底。
  check:
    state: |
      公众号文章审稿，第 {{round}} 轮评稿结果（评分模型输出）：
      总分 {{total}}（通过线 {{pass_score}}），结论 {{verdict}}。
      篇幅：当前 {{word_count}} 字，要求 {{length.min}}-{{length.max}} 字。
      剩余问题：
      {{issues}}
      必须修改：
      {{must_fix}}
    instructions: |
      判断这篇稿件是否还需要继续修改。done = 已达到可发表水准，剩余问题只是小瑕疵；continue = 还有必须修复的问题（篇幅不达标、high 级硬伤、事实或结构缺陷、评分结论为 revise 且给出了可执行的修改项）。只依据给出的评分与问题清单判断，不要臆测原文内容。
    criteria_done: "已达到可发表水准：总分过线、结论 pass、无 high 级问题、篇幅在要求区间；剩余仅为可选优化。"
    criteria_continue: "仍需修改：存在 high 级问题或必须修改项；或篇幅不在要求区间；或结论为 revise 且问题具体可执行、再改一轮能明显提升。"
