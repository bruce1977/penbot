# 流程节点总入口
#
# 节点按大步骤拆到 config/steps/，文件编号 = 该阶段产物编号（NN-step/、NN-result.json）：
#   10-topic.yaml      判断类型 / 选题 / 收集素材
#   20-draft.yaml      生成纲要 / 组装初稿输入 / 写初稿
#   30-review.yaml     核稿 / 修正 / 评稿+判定（每轮：核稿 → 修正 → 评稿 → 判定）
#   40-compose.yaml    组稿：去 AI 化 + 生成配图（两路并发，完成后组装成稿）
#   50-publish.yaml    发布 / 归档
#
# 节点配置用 key → value：key 是 step_name，value 是步骤参数。
# 模型调用统一写在节点里（统一标准见根目录 AGENTS.md）：
#   models:
#     <调用名>: { id: <config/models.yaml 模型 id>, options: { 调用级覆盖 } }
# options 未配置的参数吃 models.yaml 端点默认；无模型调用的节点不写 models 段。
# 提示词和数据结构不在这里配置，节点只写 id：
#   config/prompts/<命名空间>.yaml
#   config/schemas/<命名空间>.yaml
#
# 这个文件只保留 phases：阶段名 → 阶段文件。
#
# 元数据字段的合法词汇由入口校验（scripts/wechat-article.mjs 的 PIPELINE_STAGES /
# SKIPPABLE_STEPS，写错 validate 直接报错）：
#   stage    = 该节点属于哪一次 --stage 边界：topic|draft|review|compose|publish。
#              10-topic.yaml 的三个节点都属 topic（判断类型与素材收集都在 01 步内），
#              50-publish.yaml 的归档属 publish（同一停止边界，只是 05 步内的另一分支）。
#   enabled  只允许写在入口真能跳过的节点上：de_ai / image_generation / publish / archive。
#              其余节点关掉流程就走不下去，写 enabled 是假开关——已从配置中删除。

phases:
  topic: steps/10-topic.yaml
  draft: steps/20-draft.yaml
  review: steps/30-review.yaml
  compose: steps/40-compose.yaml
  publish: steps/50-publish.yaml
