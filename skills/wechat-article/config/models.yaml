# 模型总表
#
# 所有模型按类型分组，节点、类型和 defaults 只写模型 id：
#   model: llm.local
#   model: llm.large
#   model: opencode.writer
#   model: systemone.classifier
#   model: none                  # 纯本地脚本，不调模型
#
# 当前三类：
#   llm        文本模型（Ollama / OpenAI 兼容端点）
#   opencode   OpenCode CLI agent
#   systemone  System One 决策模型
#
# 新增模型：在对应分类下加子项，id = <分类>.<子项>。
# 后续增加 reranker 时，直接加 reranker: 段即可。
#
# 字段统一用小写：base_url / model / api_key；大写 BASE_URL / MODEL_NAME /
# API_KEY 也兼容，但同一个模型里只写一种。

version: 1

llm:
  local:
    provider: ollama
    base_url: "${LOCAL_LLM_BASE_URL:-http://localhost:11434}"
    model: "${LOCAL_LLM_BASE_MODEL:-qwen3.5:9b}"
    api_key: "${LOCAL_LLM_API_KEY}"
    timeout_ms: 600000
    temperature: 0.7
    num_ctx: 32768
    max_tokens: 4096

  small:
    provider: ollama
    base_url: "${LOCAL_LLM_BASE_URL:-http://localhost:11434}"
    model: "${LOCAL_LLM_SMALL_MODEL:-qwen3.5:4b}"
    api_key: "${LOCAL_LLM_API_KEY}"
    timeout_ms: 600000
    temperature: 0.7
    num_ctx: 32768
    max_tokens: 4096

  large:
    provider: ollama
    base_url: "${LOCAL_LLM_BASE_URL:-http://localhost:11434}"
    model: "${LOCAL_LLM_LARGE_MODEL:-qwen3.6:35b}"
    api_key: "${LOCAL_LLM_API_KEY}"
    timeout_ms: 1200000
    temperature: 0.7
    num_ctx: 32768
    max_tokens: 4096

  remote:
    provider: openai
    base_url: "${PB_LLM_BASE_URL:-https://api.deepseek.com}"
    model: "${PB_LLM_MODEL:-deepseek-chat}"
    api_key: "${PB_LLM_API_KEY}"
    timeout_ms: 300000
    temperature: 0.7
    max_tokens: 4096

opencode:
  writer:
    command: opencode
    agent: wechat-article-writer
    timeout_ms: 600000

systemone:
  # 一次判断（轻量模型）；置信度低于 classifier.escalate_below 时升级到二次判断
  classifier:
    base_url: "${SYSTEMONE_BASE_URL}"
    endpoint: "/v1/systemone"
    api_key: "${SYSTEMONE_API_KEY}"
    model: "${SYSTEMONE_MODEL1:-tev1}"
    timeout_ms: 60000
    max_retries: 2
  # 二次判断（重模型）；base_url / api_key 与一次判断相同，可在本节点覆盖
  classifier-deep:
    base_url: "${SYSTEMONE_BASE_URL}"
    endpoint: "/v1/systemone"
    api_key: "${SYSTEMONE_API_KEY}"
    model: "${SYSTEMONE_MODEL2:-nimble}"
    timeout_ms: 120000
    max_retries: 2
