# 选题阶段：判断类型 → 选题 → 收集素材
#
# key = step_name。节点默认值在 config/steps.yaml 的 defaults。
# 提示词和数据结构只引用 id：config/prompts/、config/schemas/。

steps:
  classify_type:
    label: 判断文章类型
    description: 根据标题 + 提纲，用 System One 决策模型选择最合适的文章类型。
    stage: type
    enabled: true
    modes: [auto, manual, run]
    handler: builtin:classify_type
    model: systemone.classifier
    prompt: topic.classify_type
    schema: topic.classify_type
    retry_limit: 2
    timeout: 30000
    artifacts:
      reads: ["01-topic.json", "03-outline.json"]
      writes: ["state.json#classification"]
    depends_on: []

  select_topic:
    label: 选题
    description: 从近期知识库文章中提炼一个可写、可证伪的主题；手动入口可跳过。
    stage: topic
    enabled: true
    modes: [auto, run]
    handler: builtin:select_topic
    # 不写 model 就继承 defaults.model；需要更大模型时改成 llm.large。
    model: llm.local
    prompt: topic.select_topic
    schema: topic.select_topic
    retry_limit: 2
    timeout: 900000
    artifacts:
      reads: ["01-sources.json"]
      writes: ["01-topic.json", "01-topic.md"]
    depends_on: []

  gather_materials:
    label: 收集素材
    description: 按主题关键词扫描本地知识库，截取相关段落并排序。
    stage: sources
    enabled: true
    modes: [auto, manual, run]
    handler: builtin:gather_materials
    model: none
    schema: topic.gather_materials
    retry_limit: 1
    timeout: 120000
    artifacts:
      reads: ["01-topic.json"]
      writes: ["02-sources.json"]
    depends_on: [select_topic]
