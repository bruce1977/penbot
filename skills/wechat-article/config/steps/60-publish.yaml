# 发布阶段：发布 → 归档
#
# key = step_name。节点默认值在 config/steps.yaml 的 defaults。
# 这两个节点不调用模型，也不需要提示词，只引用数据结构 id。

steps:
  publish:
    label: 发布
    description: 生成终稿，按渠道开关投递邮件和公众号草稿；未真实成功则留在 draft/。
    stage: publish
    enabled: true
    modes: [auto, manual, run, publish]
    handler: builtin:publish_article
    model: none
    schema: publish.publish
    handler_options:
      channels:
        email:
          enabled: "${PB_EMAIL_ENABLED:-false}"
        wechat:
          enabled: "${PB_WECHAT_ENABLED:-false}"
          command: "${PB_WECHAT_COMMAND:-npx --yes @wenyan-md/cli}"
      auto_publish: "${PB_AUTO_PUBLISH:-false}"
    retry_limit: 1
    timeout: 300000
    artifacts:
      reads: ["06-illustrated.md"]
      writes: ["07-final.md", "07-final.html?", "08-publish.json"]
    depends_on: [image_generation]

  archive:
    label: 归档
    description: 发布成功后复制终稿到知识库 pipeline，打包到 published/，再删除 draft/<slug>/。
    stage: archive
    enabled: true
    modes: [auto, manual, run, publish]
    handler: builtin:archive_article
    model: none
    schema: publish.archive
    retry_limit: 1
    timeout: 120000
    artifacts:
      reads: ["08-publish.json"]
      writes: ["../../published/<date>-<slug>.zip"]
    depends_on: [publish]
