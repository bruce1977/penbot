# 审稿阶段：核稿 → 评稿
#
# key = step_name。节点默认值在 config/steps.yaml 的 defaults。
# 提示词和数据结构只引用 id：config/prompts/、config/schemas/。

steps:
  review:
    label: 核稿
    description: 先走中文校对接口，接口不可用时用模型兜底；只修错别字和敏感词。
    stage: review
    enabled: true
    modes: [auto, manual, run, review]
    handler: builtin:review_article
    model: llm.local
    prompt: review.review
    schema: review.review
    handler_options:
      correct_cn:
        enabled: true
        base_url: "${PB_PYCORRECTOR_API_URL:-https://corrector.myehome.cn}"
        endpoint: "/api/pipeline"
        api_key: "${PB_PYCORRECTOR_AUTH_KEY}"
        auth_header: X-Auth-Key
        apply: issues
        fallback_llm: true
        timeout: 180000
    retry_limit: 1
    timeout: 180000
    artifacts:
      reads: ["05-draft.md"]
      writes: ["06-review/round-<n>/before.md", "06-review/round-<n>/correct.json", "06-review/round-<n>/after-correct.md"]
    depends_on: [draft_writing]

  scoring:
    label: 评稿
    description: 按类型评分维度打分，输出总分、问题和修改建议。
    stage: review
    enabled: true
    modes: [auto, manual, run, review]
    handler: builtin:score_article
    model: llm.local
    prompt: review.scoring
    schema: review.scoring
    retry_limit: 2
    timeout: 900000
    loop:
      group: review
      max_rounds: 3
      until: "total >= pass_score"
    artifacts:
      reads: ["06-reviewed.md", "05-draft.md"]
      writes: ["06-review/round-<n>/score.json"]
    depends_on: [review]
