# 纲要阶段：生成纲要 → 组装初稿输入
#
# key = step_name。节点默认值在 config/steps.yaml 的 defaults。
# 提示词和数据结构只引用 id：config/prompts/、config/schemas/。

steps:
  outline:
    label: 生成纲要
    description: 把主题、素材和类型要求整理成可逐节写作的纲要。
    stage: outline
    enabled: true
    modes: [auto, run]
    handler: builtin:generate_outline
    model: llm.local
    prompt: outline.outline
    schema: outline.outline
    retry_limit: 2
    timeout: 1200000
    artifacts:
      reads: ["01-topic.json", "02-sources.json"]
      writes: ["03-outline.json", "03-outline.md"]
    depends_on: [gather_materials]

  bundle_draft_input:
    label: 组装初稿输入
    description: 把标题、大纲、素材和类型要求组装成 04-draft-input.json，并校验 schema。
    stage: bundle
    enabled: true
    modes: [auto, manual, run]
    handler: builtin:build_draft_input
    model: none
    schema: outline.bundle_draft_input
    retry_limit: 0
    timeout: 30000
    artifacts:
      reads: ["03-outline.json", "02-sources.json"]
      writes: ["04-draft-input.json"]
    depends_on: [outline, gather_materials]
