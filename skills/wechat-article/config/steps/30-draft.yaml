# 初稿阶段：写初稿 → 篇幅调整
#
# key = step_name。节点默认值在 config/steps.yaml 的 defaults。
# 提示词和数据结构只引用 id：config/prompts/、config/schemas/。

steps:
  draft_writing:
    label: 写初稿
    description: 按 04-draft-input.json 的 prompt + schema 写出完整 Markdown 初稿。
    stage: draft
    enabled: true
    modes: [auto, manual, run]
    handler: builtin:write_draft
    model: llm.local
    prompt: draft.draft_writing
    schema: draft.draft_writing
    retry_limit: 2
    timeout: 1200000
    artifacts:
      reads: ["04-draft-input.json"]
      writes: ["05-draft.md"]
    depends_on: [bundle_draft_input]

  length_adjust:
    label: 篇幅调整
    description: 初稿字数不在区间内时，按需扩写或压缩；合格则跳过。
    stage: draft
    enabled: true
    modes: [auto, manual, run]
    handler: builtin:adjust_length
    model: llm.local
    prompt: draft.length_adjust
    schema: draft.length_adjust
    retry_limit: 1
    timeout: 900000
    loop:
      max_attempts: 2
      until: "word_count in [length.min, length.max]"
    artifacts:
      reads: ["05-draft.md"]
      writes: ["05-draft.md"]
    depends_on: [draft_writing]
