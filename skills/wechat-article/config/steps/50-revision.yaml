# 修正阶段：修正 → 去 AI 化 → 配图
#
# 节点默认值在 config/steps.yaml 的 defaults；这里只写节点差异。

steps:
  # -------------------------------------------------------------------------
  # 9. 修正
  # -------------------------------------------------------------------------
  - step_name: revision
    label: 修正
    description: 按评稿意见修改稿件，不重写；修改后回到评稿，直到通过或达到最大轮次。
    stage: review
    enabled: true
    modes: [auto, manual, run, review]
    handler: builtin:revise_article
    model: llm.local
    input_format:
      article: "string"
      review: "ScoreResult"
      round: "number"
    output_format:
      article: "string（Markdown）"
    retry_limit: 2
    timeout: 900000
    loop:
      group: review
      max_rounds: 3
      until: "score.verdict == pass"
    artifacts:
      reads: ["06-review/round-<n>/score.json"]
      writes: ["06-review/round-<n>/after-revise.md", "06-reviewed.md"]
    depends_on: [scoring]
    prompt:
      system: |
        你是「{{type_name}}」栏目的改稿编辑。
        你的任务是按审稿意见修改稿件，而不是重写。保留原文有效的结构、事实和语气。
        只输出修改后的完整 Markdown 文章，不要输出修改说明、对比或任何解释。
      user: |
        ## 审稿意见（第 {{round}} 轮）
        总分：{{total}}，结论：{{verdict}}
        {{issues}}

        ## 必须修复
        {{must_fix}}

        ## 修改原则
        1. 逐条落实审稿意见，不要遗漏 high 级问题。
        2. 不要改变文章的核心判断和已核实的事实。
        3. 修改后篇幅保持在 {{length.min}}-{{length.max}} 字。
        4. 保留 frontmatter 和所有配图标记，除非某张图明显与内容不符。
        5. 不要新增未经素材支持的数据或案例。
        {{extra}}

        ## 原稿
        {{article}}

        现在输出修改后的完整文章：

  # -------------------------------------------------------------------------
  # 10. 去 AI 化
  # -------------------------------------------------------------------------
  - step_name: de_ai
    label: 去 AI 化
    description: 把 AI 味重的表达改成自然、具体、有人味的中文；不改事实、结构、配图标记。
    stage: polish
    enabled: true
    modes: [auto, manual, run, review]
    handler: builtin:de_ai
    model: llm.local
    input_format:
      article: "string"
      style: "string?"
    output_format:
      article: "string（Markdown）"
      changes: "Array<{before: string, after: string, reason: string}>?"
    retry_limit: 1
    timeout: 900000
    artifacts:
      reads: ["06-reviewed.md"]
      writes: ["06-polished.md"]
    depends_on: [revision]
    prompt:
      system: |
        你是中文编辑，专门去除文章的 AI 写作痕迹，让它读起来像真人写的。
        保留事实、观点、结构、frontmatter 和配图标记；只改表达。
        只输出修改后的完整 Markdown 文章，不要输出说明、对比或修改列表。
      user: |
        文章标题：{{title}}
        目标风格：{{style}}

        去 AI 化规则：
        1. 删除套话和空洞过渡：首先/其次/最后、总而言之、值得注意的是、在当今 AI 时代、随着……的发展、不难发现、综上所述。
        2. 少用成对的抽象词：赋能、闭环、抓手、顶层设计、范式、维度、生态位；能用具体动词就不用名词化表达。
        3. 拆开过长句和排比句，一句话只说一件事；避免每段都是“观点 + 解释 + 总结”的模板。
        4. 把被动句改成主动句，把“我们可以看到”改成直接陈述。
        5. 加入具体动作、数字、场景或限制条件；没有素材支持的数字不要编。
        6. 保留作者的真实判断和口语感，允许短句、停顿和不确定；不要为了自然而加废话。
        7. 保留原文的 Markdown 标题层级、frontmatter 和 [[img:N]] 配图标记。
        8. 篇幅控制在 {{length.min}}-{{length.max}} 字；不要新增章节。

        {{extra}}

        ## 原稿
        {{article}}

        现在输出修改后的完整文章：

  # -------------------------------------------------------------------------
  # 11. 配图
  # -------------------------------------------------------------------------
  - step_name: image_generation
    label: 生成配图
    description: 根据纲要的 image_plan 生成封面和正文图，替换正文里的配图标记。
    stage: illustrate
    enabled: true
    modes: [auto, manual, run, illustrate]
    handler: builtin:generate_images
    # 图片通道、尺寸、并发和失败策略统一在 defaults.illustrations 里配置
    model: none
    input_format:
      article: "string"
      image_plan: "Array<{position: string, description: string, prompt: string}>"
      count: "number?"
      style: "string?"
    output_format:
      images: "Array<{index: number, position: string, file?: string, provider?: string, status: string, error?: string}>"
    retry_limit: 2
    timeout: 300000
    artifacts:
      reads: ["06-polished.md", "03-outline.json"]
      writes: ["07-images.json", "07-illustrated.md", "images/"]
    depends_on: [de_ai]
    prompt:
      system: |
        你是图片提示词编辑。根据中文画面说明生成英文 image prompt。
        只输出英文 prompt 本身，不要输出解释、编号或 Markdown。
      user: |
        文章标题：{{title}}
        画面说明：{{description}}
        统一风格：{{style}}
        避免出现：{{negative_prompt}}
        要求：描述画面主体、构图、配色和光线；不要出现任何文字、logo 或水印。
