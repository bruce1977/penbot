# 修正阶段：修正 → 去 AI 化 → 配图
#
# key = step_name。节点默认值在 config/steps.yaml 的 defaults。
# 提示词和数据结构只引用 id：config/prompts/、config/schemas/。

steps:
  revision:
    label: 修正
    description: 按评稿意见修改稿件，不重写；修改后回到评稿，直到通过或达到最大轮次。
    stage: review
    enabled: true
    modes: [auto, manual, run, review]
    handler: builtin:revise_article
    model: llm.local
    prompt: revision.revision
    schema: revision.revision
    retry_limit: 2
    timeout: 900000
    loop:
      group: review
      max_rounds: 3
      until: "score.verdict == pass"
    artifacts:
      reads: ["05-review/round-<n>/score.json"]
      writes: ["05-review/round-<n>/after-revise.md", "05-reviewed.md"]
    depends_on: [scoring]

  de_ai:
    label: 去 AI 化
    description: 把 AI 味重的表达改成自然、具体、有人味的中文；不改事实、结构、配图标记。
    stage: polish
    enabled: true
    modes: [auto, manual, run, review]
    handler: builtin:de_ai
    model: llm.local
    prompt: revision.de_ai
    schema: revision.de_ai
    retry_limit: 1
    timeout: 900000
    artifacts:
      reads: ["05-reviewed.md"]
      writes: ["05-polished.md"]
    depends_on: [revision]

  image_generation:
    label: 生成配图
    description: 根据纲要的 image_plan 生成封面和正文图，替换正文里的配图标记。
    stage: illustrate
    enabled: true
    modes: [auto, manual, run, illustrate]
    handler: builtin:generate_images
    # 图片通道、尺寸、并发和失败策略统一在 defaults.illustrations 里配置
    model: none
    prompt: revision.image_generation
    schema: revision.image_generation
    retry_limit: 2
    timeout: 300000
    artifacts:
      reads: ["05-polished.md", "02-outline.json"]
      writes: ["06-images.json", "06-illustrated.md", "images/"]
    depends_on: [de_ai]
