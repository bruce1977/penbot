# 输入/输出结构：纲要阶段
# key = 配置项名；完整 id = <文件名>.<key>，例如 topic.classify_type。

schemas:
  outline:
    input:
      type: "ArticleType"
      topic: "Topic"
      sources: "Array<Source>"
      requirements: "string?"
      max_chars: "number?"
    output:
      title: "string"
      alternatives: "string[]"
      thesis: "string"
      audience: "string"
      hook: "string"
      outline: "Array<{heading: string, points: string[], source_indexes: number[], target_words?: number}>"
      counterpoint: "string"
      takeaway: "string"
      image_plan: "Array<{position: string, description: string, prompt: string}>"

  bundle_draft_input:
    input:
      type: "ArticleType"
      outline: "Outline"
      sources: "Array<Source>"
      requirements: "string?"
    output:
      prompt: "{ system: string, user: string, retry: string }"
      schema: "Record<string, unknown>"
