# 文章类型注册表
#
# 这里只登记要加载哪些类型，以及加载顺序。
#   - 类型明细：config/types/<id>.yaml
#   - 全局默认（project / classifier / defaults）：config/defaults.yaml
#   - 模型定义（llm / opencode / systemone）：config/models.yaml
#   - 流程节点：config/steps/（入口 steps.yaml）
#
# 条目支持三种写法：
#   - ai-news                         → config/types/ai-news.yaml
#   - { file: ai-news.yaml, ... }     → 读文件，再用内联字段覆盖
#   - { id: ai-news, ... }            → 完全内联（测试/临时配置用）
# 省略 types: 时会自动扫描 config/types/*.yaml。

types:
  - ai-insight
  - ai-news
  - tech-explainer
  - homelab-practice
