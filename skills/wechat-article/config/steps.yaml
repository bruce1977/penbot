# 流程节点总入口
#
# 节点按大步骤拆到 config/steps/：
#   10-topic.yaml     判断类型 / 选题 / 收集素材
#   20-outline.yaml   生成纲要 / 组装初稿输入
#   30-draft.yaml     写初稿 / 篇幅调整
#   40-review.yaml    核稿 / 评稿
#   50-revision.yaml  修正 / 去 AI 化 / 配图
#   60-publish.yaml   发布 / 归档
#
# 节点配置用 key → value：key 是 step_name，value 是步骤参数。
# 提示词和数据结构不在这里配置，节点只写 id：
#   config/prompts/<命名空间>.yaml
#   config/schemas/<命名空间>.yaml
#
# 这个文件只保留：
#   - defaults：所有节点的默认值（模型 id、重试、超时）
#   - phases：阶段名 → 阶段文件

version: 2

defaults:
  retry_limit: 2
  timeout: 600000
  # 模型 id 定义在 config/models.yaml
  model: llm.local

phases:
  topic: steps/10-topic.yaml
  outline: steps/20-outline.yaml
  draft: steps/30-draft.yaml
  review: steps/40-review.yaml
  revision: steps/50-revision.yaml
  publish: steps/60-publish.yaml
