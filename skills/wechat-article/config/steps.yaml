# 公众号文章流水线步骤配置（steps.yaml）
#
# 这个文件回答三个问题：
#   1. 流水线有哪些步骤、先后顺序是什么；
#   2. 每一步用本地脚本、HTTP 接口还是大模型；
#   3. 大模型默认用哪套 BASE_URL / MODEL_NAME / API_KEY，提示词是什么。
#
# 约定：
#   - step_name 是唯一标识，也是 type 覆盖提示词时的 key。
#   - handler 支持三种写法：
#       builtin:select_topic             调用 scripts/lib 里的内置实现（当前默认）
#       scripts/steps/select-topic.mjs   独立的本地脚本（相对项目根目录）
#       https://example.com/api/step     HTTP 接口
#   - model.provider：
#       ollama     本地 Ollama / OpenAI 兼容端点（默认）
#       openai     任意 OpenAI 兼容端点
#       opencode   通过 opencode CLI 调模型（免费模型会轮换）
#       systemone  System One 决策模型（/v1/systemone）
#       image      图片生成接口
#       none       纯本地脚本，不调模型
#       mock       测试用，不发真实请求
#   - retry_limit 是“首次失败后的重试次数”，不含首次。
#   - timeout 单位毫秒，指单次执行（含一次模型请求）的超时。
#   - 类型可以在 config/types/<id>.yaml 里用同名步骤覆盖 model / timeout /
#     retry_limit / prompt，见本文件末尾的“类型覆盖”说明。
#
# 当前阶段：该文件由 scripts/lib/steps.mjs 加载、校验和展示；
# 执行层会按这里列出的节点逐项接入（先把节点和契约固定下来）。

version: 1

# ---------------------------------------------------------------------------
# 全局默认值：所有步骤先继承这里，再被步骤自己的配置覆盖
# ---------------------------------------------------------------------------
defaults:
  retry_limit: 2
  timeout: 600000

  # 默认写作模型：本地 Ollama 的 OpenAI 兼容端点。
  # 字段名同时接受 BASE_URL / MODEL_NAME / API_KEY（大写）和
  # base_url / model_name / api_key（小写），等价。
  model:
    PROVIDER: ollama
    BASE_URL: "${LOCAL_LLM_BASE_URL:-http://localhost:11434}"
    MODEL_NAME: "${LOCAL_LLM_BASE_MODEL:-qwen3.5:9b}"
    API_KEY: "${LOCAL_LLM_API_KEY}"
    temperature: 0.7
    max_tokens: 4096
    # Ollama 的上下文窗口；OpenAI 兼容端点会忽略这个字段
    num_ctx: 32768

# ---------------------------------------------------------------------------
# 步骤清单（顺序 = 正常执行顺序）
# ---------------------------------------------------------------------------
steps:
  # -------------------------------------------------------------------------
  # 0. 判断文章类型（可跳过）
  # -------------------------------------------------------------------------
  - step_name: classify_type
    label: 判断文章类型
    description: 根据标题 + 提纲，用 System One 决策模型选择最合适的文章类型。
    stage: type
    enabled: true
    modes: [auto, manual, run]
    handler: builtin:classify_type
    model:
      PROVIDER: systemone
      BASE_URL: "${SYSTEMONE_BASE_URL}"
      MODEL_NAME: "${SYSTEMONE_MODEL:-jev-latest}"
      API_KEY: "${SYSTEMONE_API_KEY}"
      endpoint: "/v1/systemone"
    input_format:
      title: "string"
      outline: "string?"
      types: "Array<{id: string, description?: string}>"
    output_format:
      type: "string"
      confidence: "number(0..1)"
      probabilities: "Record<string, number>?"
      source: "classifier|default|manual"
    retry_limit: 2
    timeout: 30000
    artifacts:
      reads: ["01-topic.json", "03-outline.json"]
      writes: ["state.json#classification"]
    depends_on: []
    prompt:
      instructions: |
        判断这篇公众号文章最适合归入哪个类型。只依据标题和提纲表达的内容与体裁，
        不要依据选项在列表中的顺序，也不要因为某个类型的描述更长而偏向它。
      state: |
        标题：{{title}}

        提纲：
        {{outline}}

  # -------------------------------------------------------------------------
  # 1. 选题
  # -------------------------------------------------------------------------
  - step_name: select_topic
    label: 选题
    description: 从近期知识库文章中提炼一个可写、可证伪的主题；手动入口可跳过。
    stage: topic
    enabled: true
    modes: [auto, run]
    handler: builtin:select_topic
    # 不写 model 就继承 defaults.model。
    # 需要换更大模型时，只覆盖要变的字段：
    # model:
    #   MODEL_NAME: "${LOCAL_LLM_LARGE_MODEL:-qwen3.6:35b}"
    model:
      MODEL_NAME: "${LOCAL_LLM_BASE_MODEL:-qwen3.5:9b}"
    input_format:
      type: "ArticleType"
      mode: "auto|manual"
      candidates: "Array<{title: string, date: string, summary?: string, tags: string[]}>"
      count: "number?"
      user_topic: "string?"
      requirements: "string?"
    output_format:
      topic: "string(1..30)"
      title: "string(1..64)"
      thesis: "string"
      angle: "string"
      rationale: "string"
      keywords: "string[]"
      source_hints: "string[]"
      title_candidates: "string[]"
    retry_limit: 2
    timeout: 900000
    artifacts:
      reads: ["01-sources.json"]
      writes: ["01-topic.json", "01-topic.md"]
    depends_on: []
    prompt:
      system: |
        你是「{{type_name}}」栏目的选题编辑。{{type_description}}
        目标读者：{{audience}}。
        你的任务是从近期知识库文章中提炼{{count_label}}值得写的主题，而不是简单复述某一篇。
        只输出一个合法 JSON 对象，不要输出 Markdown 代码块、解释或前后缀。
        所有字符串使用中文，除专有名词外不要夹杂英文。
        不要编造素材中不存在的事实、数字、机构或引用。
      user: |
        {{mode_line}}

        近期文章候选：
        {{candidates}}

        选题要求：
        1. 主题要具体，能用一个明确判断或问题概括，不要写成「AI 行业观察」这类空泛题目。
        2. 优先选择有事实密度、有冲突或反常识、且近期讨论度高的方向。
        3. 与已有文章形成差异，不要重复同一事件的消息面。
        4. 目标篇幅 {{length.min}}-{{length.max}} 字。

        输出 JSON 结构：
        {{output_schema}}

  # -------------------------------------------------------------------------
  # 2. 收集素材
  # -------------------------------------------------------------------------
  - step_name: gather_materials
    label: 收集素材
    description: 按主题关键词扫描本地知识库，截取相关段落并排序。
    stage: sources
    enabled: true
    modes: [auto, manual, run]
    handler: builtin:gather_materials
    model:
      PROVIDER: none
    input_format:
      topic: "Topic"
      keywords: "string[]"
      knowledge_dirs: "string[]"
      max_sources: "number?"
      lookback_days: "number?"
    output_format:
      sources: "Array<{title: string, path: string, date: string, tags: string[], excerpt: string, score: number}>"
    retry_limit: 1
    timeout: 120000
    artifacts:
      reads: ["01-topic.json"]
      writes: ["02-sources.json"]
    depends_on: [select_topic]

  # -------------------------------------------------------------------------
  # 3. 纲要
  # -------------------------------------------------------------------------
  - step_name: outline
    label: 生成纲要
    description: 把主题、素材和类型要求整理成可逐节写作的纲要。
    stage: outline
    enabled: true
    modes: [auto, run]
    handler: builtin:generate_outline
    model:
      MODEL_NAME: "${LOCAL_LLM_BASE_MODEL:-qwen3.5:9b}"
    input_format:
      type: "ArticleType"
      topic: "Topic"
      sources: "Array<Source>"
      requirements: "string?"
      max_chars: "number?"
    output_format:
      title: "string"
      alternatives: "string[]"
      thesis: "string"
      audience: "string"
      hook: "string"
      outline: "Array<{heading: string, points: string[], source_indexes: number[], target_words?: number}>"
      counterpoint: "string"
      takeaway: "string"
      image_plan: "Array<{position: string, description: string, prompt: string}>"
    retry_limit: 2
    timeout: 1200000
    artifacts:
      reads: ["01-topic.json", "02-sources.json"]
      writes: ["03-outline.json", "03-outline.md"]
    depends_on: [gather_materials]
    prompt:
      system: |
        你是「{{type_name}}」栏目的资深作者。{{persona}}
        文风：{{tone}}。目标读者：{{audience}}。
        你只负责写纲要，不写正文。纲要必须能被另一位作者直接据此成文。
        只输出一个合法 JSON 对象，不要输出 Markdown 代码块、解释或前后缀。
        所有字符串使用中文，除专有名词外不要夹杂英文。
        不要编造素材中不存在的事实、数字、机构或引用。
      user: |
        主题：{{topic}}
        核心判断：{{thesis}}
        切入角度：{{angle}}
        {{requirements_block}}

        可用素材（来自本地知识库，引用时使用编号）：
        {{materials}}

        写作要求：
        1. 篇幅 {{length.min}}-{{length.max}} 字，目标 {{length.target}} 字。
        2. 结构参考：{{structure}}
        3. 必须满足的要点：{{dos}}
        4. 必须避免：{{donts}}
        {{extra}}

        评分维度（成文后会按此打分，纲要需为每个维度预留内容）：
        {{scoring_dimensions}}

        配图规划：
        - 全文配图 {{image.min}}-{{image.max}} 张，建议 {{image.count}} 张。
        - 配图风格：{{image.style}}。
        - 每张图给出插入位置、画面说明（30-80 字）和英文 Prompt（描述画面主体、构图、配色，不要文字）。

        输出 JSON 结构：
        {{output_schema}}

  # -------------------------------------------------------------------------
  # 4. 组装初稿输入
  # -------------------------------------------------------------------------
  - step_name: bundle_draft_input
    label: 组装初稿输入
    description: 把标题、大纲、素材和类型要求组装成 04-draft-input.json，并校验 schema。
    stage: bundle
    enabled: true
    modes: [auto, manual, run]
    handler: builtin:build_draft_input
    model:
      PROVIDER: none
    input_format:
      type: "ArticleType"
      outline: "Outline"
      sources: "Array<Source>"
      requirements: "string?"
    output_format:
      prompt: "{ system: string, user: string, retry: string }"
      schema: "Record<string, unknown>"
    retry_limit: 0
    timeout: 30000
    artifacts:
      reads: ["03-outline.json", "02-sources.json"]
      writes: ["04-draft-input.json"]
    depends_on: [outline, gather_materials]

  # -------------------------------------------------------------------------
  # 5. 写初稿
  # -------------------------------------------------------------------------
  - step_name: draft_writing
    label: 写初稿
    description: 按 04-draft-input.json 的 prompt + schema 写出完整 Markdown 初稿。
    stage: draft
    enabled: true
    modes: [auto, manual, run]
    handler: builtin:write_draft
    model:
      MODEL_NAME: "${LOCAL_LLM_BASE_MODEL:-qwen3.5:9b}"
    input_format:
      draft_input: "DraftInput（见 04-draft-input.json）"
    output_format:
      article: "string（Markdown，含 frontmatter 和配图标记）"
    retry_limit: 2
    timeout: 1200000
    artifacts:
      reads: ["04-draft-input.json"]
      writes: ["05-draft.md"]
    depends_on: [bundle_draft_input]
    prompt:
      # 长模板和 schema 仍放在 config/prompts/draft.json；这里只声明默认来源，
      # 类型可用 steps.draft_writing.prompt 覆盖 system/user/retry/extra。
      template: "prompts/draft.json"
      system: ""
      user: ""
      retry: ""
      extra: ""

  # -------------------------------------------------------------------------
  # 6. 篇幅调整（条件步骤）
  # -------------------------------------------------------------------------
  - step_name: length_adjust
    label: 篇幅调整
    description: 初稿字数不在区间内时，按需扩写或压缩；合格则跳过。
    stage: draft
    enabled: true
    modes: [auto, manual, run]
    handler: builtin:adjust_length
    model:
      MODEL_NAME: "${LOCAL_LLM_BASE_MODEL:-qwen3.5:9b}"
    input_format:
      article: "string"
      word_count: "number"
      direction: "expand|condense"
      target: "number"
    output_format:
      article: "string"
    retry_limit: 1
    timeout: 900000
    loop:
      max_attempts: 2
      until: "word_count in [length.min, length.max]"
    artifacts:
      reads: ["05-draft.md"]
      writes: ["05-draft.md"]
    depends_on: [draft_writing]
    prompt:
      system: |
        你是「{{type_name}}」栏目的改稿编辑。只输出完整的 Markdown 文章，
        不要输出任何说明、对比或解释。
      retry: |
        上一稿不合格（第 {{retry_tag}} 次尝试）：
        {{errors}}

        修改要求：
        {{length_fix}}

        保留第一行 frontmatter、所有小节标题和配图标记；只输出完整 Markdown 正文。

        ## 原稿
        {{article}}

  # -------------------------------------------------------------------------
  # 7. 核稿（错别字 / 敏感词）
  # -------------------------------------------------------------------------
  - step_name: review
    label: 核稿
    description: 先走中文校对接口，接口不可用时用模型兜底；只修错别字和敏感词。
    stage: review
    enabled: true
    modes: [auto, manual, run, review]
    handler: builtin:review_article
    model:
      MODEL_NAME: "${LOCAL_LLM_BASE_MODEL:-qwen3.5:9b}"
    handler_options:
      correct_cn:
        enabled: true
        base_url: "${PB_PYCORRECTOR_API_URL:-https://corrector.myehome.cn}"
        endpoint: "/api/pipeline"
        api_key: "${PB_PYCORRECTOR_AUTH_KEY}"
        auth_header: X-Auth-Key
        apply: issues
        fallback_llm: true
        timeout: 180000
    input_format:
      article: "string"
      round: "number"
    output_format:
      article: "string（修正后）"
      issues: "Array<{type: string, original: string, corrected: string, suggestion?: string}>"
      channel: "correct-cn|llm|none"
    retry_limit: 1
    timeout: 180000
    artifacts:
      reads: ["05-draft.md"]
      writes: ["06-review/round-<n>/before.md", "06-review/round-<n>/correct.json", "06-review/round-<n>/after-correct.md"]
    depends_on: [draft_writing]
    prompt:
      system: |
        你是中文校对员。只修复错别字、敏感词和语法错误，不润色文风，不改变结构和事实。
        只输出修正后的完整 Markdown。
      user: |
        ## 待修复问题
        {{issues}}

        ## 原文
        {{article}}

        请输出修正后的完整文章：

  # -------------------------------------------------------------------------
  # 8. 评稿
  # -------------------------------------------------------------------------
  - step_name: scoring
    label: 评稿
    description: 按类型评分维度打分，输出总分、问题和修改建议。
    stage: review
    enabled: true
    modes: [auto, manual, run, review]
    handler: builtin:score_article
    model:
      MODEL_NAME: "${LOCAL_LLM_BASE_MODEL:-qwen3.5:9b}"
    input_format:
      article: "string"
      word_count: "number"
      round: "number"
      scoring_criteria: "Array<{id: string, name: string, weight: number, description?: string}>"
    output_format:
      dimensions: "Array<{id: string, name: string, score: number, comment: string}>"
      total: "number(0..100)"
      verdict: "pass|revise"
      strengths: "string[]"
      issues: "Array<{severity: string, dimension: string, location: string, problem: string, fix: string}>"
      must_fix: "string[]"
      suggested_title: "string?"
    retry_limit: 2
    timeout: 900000
    loop:
      group: review
      max_rounds: 3
      until: "total >= pass_score"
    artifacts:
      reads: ["06-reviewed.md", "05-draft.md"]
      writes: ["06-review/round-<n>/score.json"]
    depends_on: [review]
    prompt:
      system: |
        你是微信公众号「{{type_name}}」栏目的终审编辑，以严格、具体、可执行为标准评稿。
        你不负责鼓励作者，只负责指出真实问题。
        评分必须区分档次：有明显硬伤的稿件不得高于 75 分；达到发表水准才给 80 分以上。
        只输出一个合法 JSON 对象，不要输出 Markdown 代码块、解释或前后缀。
      user: |
        请对下面这篇稿件进行第 {{round}} 轮评稿。

        ## 栏目要求
        - 篇幅要求：{{length.min}}-{{length.max}} 字，当前 {{word_count}} 字。
        - 目标读者：{{audience}}
        - 文风：{{tone}}
        - 结构：{{structure}}
        - 必须做到：{{dos}}
        - 必须避免：{{donts}}
        - 通过分数线：{{pass_score}}

        ## 评分维度（每个维度 0-100 分）
        {{scoring_dimensions}}

        ## 稿件
        {{article}}

        ## 输出 JSON 结构
        {{output_schema}}

        注意：total 必须等于各维度按权重加权后的结果。

  # -------------------------------------------------------------------------
  # 9. 修正
  # -------------------------------------------------------------------------
  - step_name: revision
    label: 修正
    description: 按评稿意见修改稿件，不重写；修改后回到评稿，直到通过或达到最大轮次。
    stage: review
    enabled: true
    modes: [auto, manual, run, review]
    handler: builtin:revise_article
    model:
      MODEL_NAME: "${LOCAL_LLM_BASE_MODEL:-qwen3.5:9b}"
    input_format:
      article: "string"
      review: "ScoreResult"
      round: "number"
    output_format:
      article: "string（Markdown）"
    retry_limit: 2
    timeout: 900000
    loop:
      group: review
      max_rounds: 3
      until: "score.verdict == pass"
    artifacts:
      reads: ["06-review/round-<n>/score.json"]
      writes: ["06-review/round-<n>/after-revise.md", "06-reviewed.md"]
    depends_on: [scoring]
    prompt:
      system: |
        你是「{{type_name}}」栏目的改稿编辑。
        你的任务是按审稿意见修改稿件，而不是重写。保留原文有效的结构、事实和语气。
        只输出修改后的完整 Markdown 文章，不要输出修改说明、对比或任何解释。
      user: |
        ## 审稿意见（第 {{round}} 轮）
        总分：{{total}}，结论：{{verdict}}
        {{issues}}

        ## 必须修复
        {{must_fix}}

        ## 修改原则
        1. 逐条落实审稿意见，不要遗漏 high 级问题。
        2. 不要改变文章的核心判断和已核实的事实。
        3. 修改后篇幅保持在 {{length.min}}-{{length.max}} 字。
        4. 保留 frontmatter 和所有配图标记，除非某张图明显与内容不符。
        5. 不要新增未经素材支持的数据或案例。
        {{extra}}

        ## 原稿
        {{article}}

        现在输出修改后的完整文章：

  # -------------------------------------------------------------------------
  # 10. 配图
  # -------------------------------------------------------------------------
  - step_name: image_generation
    label: 生成配图
    description: 根据纲要的 image_plan 生成封面和正文图，替换正文里的配图标记。
    stage: illustrate
    enabled: true
    modes: [auto, manual, run, illustrate]
    handler: builtin:generate_images
    model:
      PROVIDER: image
      BASE_URL: "${PB_IMAGE_BASE_URL:-https://api-inference.modelscope.cn}"
      MODEL_NAME: "${PB_IMAGE_MODEL:-Tongyi-MAI/Z-Image-Turbo}"
      API_KEY: "${PB_MODEL_IMAGE_API_KEY}"
    handler_options:
      fallbacks:
        - provider: pollinations
          base_url: "${PB_POLLINATIONS_BASE_URL:-https://image.pollinations.ai}"
          model: "${PB_POLLINATIONS_MODEL:-turbo}"
      scenes:
        wechat-cover: { width: 900, height: 383 }
        article-inline: { width: 1080, height: 810 }
      concurrency: 2
      on_failure: comment
    input_format:
      article: "string"
      image_plan: "Array<{position: string, description: string, prompt: string}>"
      count: "number?"
      style: "string?"
    output_format:
      images: "Array<{index: number, position: string, file?: string, provider?: string, status: string, error?: string}>"
    retry_limit: 2
    timeout: 300000
    artifacts:
      reads: ["06-reviewed.md", "03-outline.json"]
      writes: ["07-images.json", "07-illustrated.md", "images/"]
    depends_on: [revision]
    prompt:
      system: |
        你是图片提示词编辑。根据中文画面说明生成英文 image prompt。
        只输出英文 prompt 本身，不要输出解释、编号或 Markdown。
      user: |
        文章标题：{{title}}
        画面说明：{{description}}
        统一风格：{{style}}
        避免出现：{{negative_prompt}}
        要求：描述画面主体、构图、配色和光线；不要出现任何文字、logo 或水印。

  # -------------------------------------------------------------------------
  # 11. 发布
  # -------------------------------------------------------------------------
  - step_name: publish
    label: 发布
    description: 生成终稿，按渠道开关投递邮件和公众号草稿；未真实成功则留在 draft/。
    stage: publish
    enabled: true
    modes: [auto, manual, run, publish]
    handler: builtin:publish_article
    model:
      PROVIDER: none
    handler_options:
      channels:
        email:
          enabled: "${PB_EMAIL_ENABLED:-false}"
        wechat:
          enabled: "${PB_WECHAT_ENABLED:-false}"
          command: "${PB_WECHAT_COMMAND:-npx --yes @wenyan-md/cli}"
      auto_publish: "${PB_AUTO_PUBLISH:-false}"
    input_format:
      article: "string"
      images: "Array<Image>"
      title: "string"
    output_format:
      status: "published|partial|skipped|dry_run|failed"
      channels: "Record<string, {ok: boolean, detail?: string}>"
      archive: "{ enabled: boolean, knowledge_file?: string, zip?: string }"
    retry_limit: 1
    timeout: 300000
    artifacts:
      reads: ["07-illustrated.md"]
      writes: ["08-final.md", "08-final.html?", "09-publish.json"]
    depends_on: [image_generation]

  # -------------------------------------------------------------------------
  # 12. 归档
  # -------------------------------------------------------------------------
  - step_name: archive
    label: 归档
    description: 发布成功后复制终稿到知识库 pipeline，打包到 published/，再删除 draft/<slug>/。
    stage: archive
    enabled: true
    modes: [auto, manual, run, publish]
    handler: builtin:archive_article
    model:
      PROVIDER: none
    input_format:
      publish: "09-publish.json"
      article_dir: "string"
    output_format:
      zip: "string"
      knowledge_file: "string?"
      removed: "boolean"
    retry_limit: 1
    timeout: 120000
    artifacts:
      reads: ["09-publish.json"]
      writes: ["../../published/<date>-<slug>.zip"]
    depends_on: [publish]

