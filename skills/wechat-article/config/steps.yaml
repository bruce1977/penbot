# 流程节点总入口
#
# 节点按大步骤拆到 config/steps/：
#   10-topic.yaml     判断类型 / 选题 / 收集素材
#   20-outline.yaml   生成纲要 / 组装初稿输入
#   30-draft.yaml     写初稿 / 篇幅调整
#   40-review.yaml    核稿 / 评稿
#   50-revision.yaml  修正 / 去 AI 化 / 配图
#   60-publish.yaml   发布 / 归档
#
# 这个文件只保留：
#   - defaults：所有节点的默认值（模型 id、重试、超时）
#   - steps：阶段文件的加载顺序
#
# 节点字段、类型覆盖和提示词优先级见 SKILL.md。

version: 1

defaults:
  retry_limit: 2
  timeout: 600000
  # 模型 id 定义在 config/models.yaml
  model: llm.local

# 顺序 = 正常执行顺序；每个文件里的 steps: 会依次展开。
steps:
  - steps/10-topic.yaml
  - steps/20-outline.yaml
  - steps/30-draft.yaml
  - steps/40-review.yaml
  - steps/50-revision.yaml
  - steps/60-publish.yaml
