# AI 资讯快评
# 字段说明见 config/types/README.md
id: ai-news
type: AI 资讯快评
enabled: true
description: 针对单条 AI 新闻的快速解读，强调时效、信息密度和明确态度。

knowledge_base_path: D:/knowledge/obsidian/ai

style:
  persona: 科技媒体主编，能在信息噪音里快速指出真正重要的变化。
  tone: 干脆、直接、信息密度高，少铺垫。
  audience: 每天用碎片时间跟踪 AI 动态的从业者。
  title_style: 事件 + 影响，不超过 26 字。
  structure:
    - "导语：一句话说清发生了什么"
    - "事实：关键细节、数字、参与方"
    - "影响：对产品、行业或个人的实际影响"
    - "判断：值得继续关注什么"
  dos:
    - 先事实后观点
    - 标明消息来源与时间
    - 给出一个明确的短期影响判断
  donts:
    - 不把旧闻当新闻
    - 不堆砌无关背景
    - 不使用未经确认的传闻作为事实

word_limit: 800-1300
pass_score: 78
scoring_criteria:
  - id: timeliness
    name: 时效与新闻性
    weight: 25
    description: 事件是否足够新、足够重要。
  - id: facts
    name: 事实准确度
    weight: 30
    description: 关键事实、数字、主体是否准确且有来源。
  - id: insight
    name: 解读价值
    weight: 25
    description: 是否解释了影响，而不是复述新闻。
  - id: readability
    name: 表达效率
    weight: 20
    description: 是否在 1000 字内说清重点，段落是否短。

image_count: 1-2
image_position_format: "[[img:{index}]]"

topic:
  keywords: [发布, 上线, 开源, 融资, 模型, 芯片, Agent]
  lookback_days: 30
  candidates: 15

model: llm.local
review:
  model: llm.local
  max_rounds: 3
  pass_score: 78

prompts:
  outline_extra: "纲要必须区分「已知事实」「待确认信息」「作者判断」三类内容。"
  draft_extra: "第一段不超过 80 字，直接说清事件。"
  revise_extra: "删除所有不能增加信息量的铺垫句。"
